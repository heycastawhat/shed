name: Android

# A signed APK on a GitHub release, which the app's update check follows (as Sink's workflow does):
# - a push to shed-android that touches the app releases the next patch version (v0.1.3 -> v0.1.4) on its own;
# - tag v1.2.3 by hand for a bigger step;
# - a manual run, or a push to another branch, only builds a test APK artifact.
# Needs repository secrets: SHED_KEYSTORE_B64, SHED_KEYSTORE_PASSWORD, SHED_KEY_ALIAS, SHED_KEY_PASSWORD.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

# One release at a time, so two quick pushes don't both pick the same version.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The version: the tag's, the latest tag's next patch for a push to shed-android, else a dev build.
      # (The tag a release makes is pushed with GITHUB_TOKEN, which doesn't start another run.)
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = shed-android ]; then
            last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
            if [ -z "$last" ]; then v=0.1.0; else IFS=. read -r major minor patch <<< "$last"; v="$major.$minor.$((patch + 1))"; fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the Android SDK; Gradle fetches the platform version it needs.
      - uses: gradle/actions/setup-gradle@v6
      # Screenshots of every screen, rendered by Robolectric against a fake Shed (see app/src/test). They don't block a release.
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon :app:recordRoborazziDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHED_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shed.jks"
          echo "SHED_KEYSTORE=$RUNNER_TEMP/shed.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SHED_KEYSTORE_PASSWORD: ${{ secrets.SHED_KEYSTORE_PASSWORD }}
          SHED_KEY_ALIAS: ${{ secrets.SHED_KEY_ALIAS }}
          SHED_KEY_PASSWORD: ${{ secrets.SHED_KEY_PASSWORD }}
          SHED_VERSION_CODE: ${{ github.run_number }}
          SHED_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/shed-$SHED_VERSION_NAME.apk"
      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.name }}
        run: gh release create "v$V" "$RUNNER_TEMP/shed-$V.apk" --target "$GITHUB_SHA" --title "Shed $V" --generate-notes
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.release != 'true'
        with:
          name: shed-apk
          path: ${{ runner.temp }}/shed-*.apk
