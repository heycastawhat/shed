name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.SHED_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shed.jks"
          echo "SHED_KEYSTORE=$RUNNER_TEMP/shed.jks" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew assembleRelease
        env:
          SHED_VERSION_CODE: ${{ github.run_number }}
          SHED_VERSION_NAME: ${{ github.ref_name }}-${{ github.run_number }}
          SHED_KEYSTORE_PASSWORD: ${{ secrets.SHED_KEYSTORE_PASSWORD }}
          SHED_KEY_ALIAS: ${{ secrets.SHED_KEY_ALIAS }}
          SHED_KEY_PASSWORD: ${{ secrets.SHED_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: shed-${{ github.ref_name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
      # A prerelease per build, so the phone can download the newest APK from the Releases page.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "shed-${{ github.run_number }}.apk"
          gh release create "android-${{ github.run_number }}" "shed-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" --title "Android ${{ github.ref_name }} #${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}."
