services:
  shed:
    build:
      context: .
      args:
        AGENTS: ${AGENTS:-claude}
    image: shed
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SHED_DATA: /data
      FORGE_DATA: /data
    ports:
      - ${SHED_HTTP_PORT:-3080}:3000
      - ${SHED_SSH_HOST_PORT:-2223}:2222
    volumes:
      - data:/data
      - t3:/home/bun/.t3
      - projects:/home/bun/.t3/projects
      - claude:/home/bun/.claude
      - codex:/home/bun/.codex

volumes:
  data:
  t3:
  projects:
  claude:
  codex:
